<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Setup - MTOP Client</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
        <style>
            .toast-enter {
                transform: translateY(-100%);
                opacity: 0;
            }
            .toast-enter-active {
                transform: translateY(0);
                opacity: 1;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
            .toast-exit {
                transform: translateY(-100%);
                opacity: 0;
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            }
        </style>
    </head>
    <body
        class="bg-slate-50 h-screen flex flex-col items-center justify-center font-sans relative overflow-hidden"
    >
        <div
            id="toast-container"
            class="absolute top-6 left-0 right-0 flex justify-center z-50 pointer-events-none"
        ></div>

        <div
            class="absolute inset-0 z-0 opacity-5 flex items-center justify-center pointer-events-none"
        >
            <img
                src="MunicipalityLogo.png"
                alt="Background"
                class="w-1/2 object-contain"
                onerror="this.style.display = 'none'"
            />
        </div>

        <div
            class="bg-white p-8 sm:p-10 rounded-2xl shadow-xl max-w-md w-full border border-gray-100 relative z-10"
        >
            <div class="flex justify-center mb-6">
                <div class="bg-blue-50 p-4 rounded-full text-blue-600">
                    <iconify-icon
                        icon="solar:server-square-bold-duotone"
                        width="48"
                    ></iconify-icon>
                </div>
            </div>

            <div class="text-center mb-8">
                <h1
                    class="text-2xl font-extrabold text-gray-900 tracking-tight"
                >
                    Connect to Server
                </h1>
                <p class="text-gray-500 text-sm mt-2">
                    Enter the IPv4 address of the main MTOP Server to establish
                    a connection.
                </p>
            </div>

            <div class="space-y-5">
                <div>
                    <label
                        class="block text-xs font-bold text-gray-700 uppercase tracking-widest mb-2"
                        >Host IP Address</label
                    >
                    <div class="relative flex items-center">
                        <div class="absolute left-4 text-gray-400">
                            <iconify-icon
                                icon="solar:laptop-minimalistic-bold"
                                width="20"
                            ></iconify-icon>
                        </div>
                        <input
                            type="text"
                            id="ipInput"
                            placeholder="192.168.1.xxx"
                            onkeydown="handleEnter(event)"
                            class="w-full pl-12 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white transition-all outline-none text-lg font-mono font-bold text-gray-800 tracking-wider"
                            autofocus
                        />
                    </div>
                </div>

                <button
                    id="connectBtn"
                    onclick="saveAndConnect()"
                    class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3.5 rounded-lg transition-all shadow-md flex items-center justify-center gap-2 group"
                >
                    <span id="btnText">Establish Connection</span>
                    <iconify-icon
                        id="btnIcon"
                        icon="solar:arrow-right-bold"
                        width="20"
                        class="group-hover:translate-x-1 transition-transform"
                    ></iconify-icon>
                </button>
            </div>

            <div
                class="mt-8 p-4 bg-amber-50 text-amber-800 rounded-lg text-xs font-medium border border-amber-200 flex gap-3 items-start"
            >
                <iconify-icon
                    icon="solar:info-circle-bold"
                    width="20"
                    class="shrink-0 text-amber-500"
                ></iconify-icon>
                <p>
                    Check the Dashboard on the main computer to find the correct
                    Host IP Address.
                </p>
            </div>
        </div>

        <script>
            const { ipcRenderer } = require("electron");

            // Listen for connection failures from main.js
            ipcRenderer.on("connection-failed", (event, attemptedIp) => {
                showToast(
                    `Could not connect to ${attemptedIp}:8000. Is the server running?`,
                    "error",
                );
                resetButton();
            });

            function showToast(message, type = "error") {
                const container = document.getElementById("toast-container");
                const toast = document.createElement("div");

                const bgColor =
                    type === "error" ? "bg-red-500" : "bg-green-500";
                const icon =
                    type === "error"
                        ? "solar:danger-triangle-bold"
                        : "solar:check-circle-bold";

                toast.className = `flex items-center gap-3 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg font-medium text-sm toast-enter pointer-events-auto`;
                toast.innerHTML = `
                    <iconify-icon icon="${icon}" width="20"></iconify-icon>
                    ${message}
                `;

                container.appendChild(toast);

                // Trigger animation
                requestAnimationFrame(() => {
                    toast.classList.add("toast-enter-active");
                });

                // Remove after 4 seconds
                setTimeout(() => {
                    toast.classList.add("toast-exit");
                    setTimeout(() => toast.remove(), 300);
                }, 4000);
            }

            function handleEnter(event) {
                if (event.key === "Enter") {
                    saveAndConnect();
                }
            }

            function setLoadingState() {
                const btn = document.getElementById("connectBtn");
                const btnText = document.getElementById("btnText");
                const btnIcon = document.getElementById("btnIcon");
                const input = document.getElementById("ipInput");

                btn.disabled = true;
                btn.classList.add("opacity-80", "cursor-not-allowed");
                input.disabled = true;
                input.classList.add("opacity-50");

                btnText.innerText = "Connecting...";
                btnIcon.setAttribute("icon", "solar:restart-bold");
                btnIcon.classList.add("animate-spin");
                btnIcon.classList.remove("group-hover:translate-x-1");
            }

            function resetButton() {
                const btn = document.getElementById("connectBtn");
                const btnText = document.getElementById("btnText");
                const btnIcon = document.getElementById("btnIcon");
                const input = document.getElementById("ipInput");

                btn.disabled = false;
                btn.classList.remove("opacity-80", "cursor-not-allowed");
                input.disabled = false;
                input.classList.remove("opacity-50");

                btnText.innerText = "Establish Connection";
                btnIcon.setAttribute("icon", "solar:arrow-right-bold");
                btnIcon.classList.remove("animate-spin");
                btnIcon.classList.add("group-hover:translate-x-1");

                input.focus();
            }

            function saveAndConnect() {
                let rawInput = document.getElementById("ipInput").value.trim();

                // Clean the input (remove http://, port, and trailing slashes)
                let cleanIp = rawInput
                    .replace(/^https?:\/\//, "")
                    .split(":")[0]
                    .replace(/\/$/, "");

                const ipv4Regex = /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/;

                if (ipv4Regex.test(cleanIp)) {
                    setLoadingState();
                    ipcRenderer.send("save-ip", cleanIp);
                } else {
                    showToast(
                        "Invalid IP Address Format. Please use numbers and dots (e.g. 192.168.1.15).",
                        "error",
                    );
                    document.getElementById("ipInput").focus();
                }
            }
        </script>
    </body>
</html>
