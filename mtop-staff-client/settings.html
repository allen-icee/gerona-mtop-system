<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>System Setup - MTOP</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body
        class="bg-gray-100 h-screen flex items-center justify-center font-sans"
    >
        <div
            class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full border-t-4 border-blue-900"
        >
            <div class="text-center mb-6">
                <h1 class="text-2xl font-bold text-blue-900">
                    Connection Setup
                </h1>
                <p class="text-gray-500 text-sm mt-2">
                    Enter the IP address of the Main Server computer to connect
                    to the MTOP System.
                </p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1"
                        >Server IP Address</label
                    >
                    <input
                        type="text"
                        id="ipInput"
                        placeholder="e.g. 192.168.1.15"
                        onkeydown="handleEnter(event)"
                        class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none text-center text-lg font-mono"
                    />
                </div>

                <button
                    onclick="saveAndConnect()"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-md transition-colors shadow-md"
                >
                    Connect to System
                </button>
            </div>

            <div
                class="mt-6 p-4 bg-yellow-50 text-yellow-800 rounded-md text-xs border border-yellow-200"
            >
                <strong>Need help?</strong> Look at the Dashboard on the Main
                Server Admin PC to find the correct Host IP Address.
            </div>
        </div>

        <script>
            const { ipcRenderer } = require("electron");

            // Allow pressing "Enter" to submit
            function handleEnter(event) {
                if (event.key === "Enter") {
                    saveAndConnect();
                }
            }

            function saveAndConnect() {
                let rawInput = document.getElementById("ipInput").value.trim();

                // SMART CLEANUP: In case they paste "http://192.168.1.15:8100/"
                let cleanIp = rawInput
                    .replace(/^https?:\/\//, "") // Removes http:// or https://
                    .split(":")[0] // Removes :8100 or any port
                    .replace(/\/$/, ""); // Removes trailing slash

                // VALIDATION: Make sure it looks like numbers with dots (IPv4)
                const ipv4Regex = /^(?:[0-9]{1,3}\.){3}[0-9]{1,3}$/;

                if (ipv4Regex.test(cleanIp)) {
                    // Send the perfectly clean IP to main.js
                    ipcRenderer.send("save-ip", cleanIp);
                } else {
                    alert(
                        "Please enter a valid IP address. (Example: 192.168.1.15)",
                    );
                    document.getElementById("ipInput").focus();
                }
            }
        </script>
    </body>
</html>
